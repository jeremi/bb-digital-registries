# Publishes this draft as an unofficial review preview on the fork's GitHub
# Pages site, so reviewers can read the rendered specification without a local
# build.
#
# The site is rendered by the shared GovStack specification renderer
# (jeremi/govstack-specification-site), pinned to a commit below. Every page
# carries a banner saying it is not an official GovStack site, and a
# noindex, nofollow robots meta tag. Update RENDERER_REF deliberately; do not
# point it at a branch.
#
# The job never runs in the GovStackWorkingGroup repository. Drop this file
# before the change is merged upstream.
name: Deploy review preview

on:
  push:
    branches:
      - docs/digital-registries-3.0.0-alpha.2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  RENDERER_REPOSITORY: jeremi/govstack-specification-site
  RENDERER_REF: 10dd20b42ff8ffd399e5b9f86ce092aff13f9b54

jobs:
  build:
    if: github.repository_owner != 'GovStackWorkingGroup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: specification
          persist-credentials: false

      - name: Check out the renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.RENDERER_REPOSITORY }}
          ref: ${{ env.RENDERER_REF }}
          path: renderer
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install the renderer
        run: npm ci
        working-directory: renderer

      - name: Render and check the site
        working-directory: renderer
        run: >-
          npm run check --
          --profile framework
          --source "$GITHUB_WORKSPACE/specification"
          --output "$RUNNER_TEMP/site"
          --base "/${{ github.event.repository.name }}/"
          --unofficial

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
