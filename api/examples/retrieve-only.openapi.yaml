  headers:
    CacheControl:
      description: Protected reads and errors use no-store. Deployments may publish
        another caching policy for public or properly isolated representations while
        preserving authorisation.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Delay in seconds or HTTP-date before retrying; authoritative over
        any advisory quota fields.
      schema:
        type: string
      example: '30'
    ApiCatalogLink:
      description: Web Link with the api-catalog relation. Its target is this well-known
        URI or the publisher's API catalog document location.
      required: true
      schema:
        type: string
        pattern: ;\s*rel\s*=\s*(?:api-catalog|"(?:[^"]*\s)?api-catalog(?:\s[^"]*)?")\s*(?:[;,]|(?![\s\S]))
      example: </.well-known/api-catalog>; rel="api-catalog"
    ApiCatalogETag:
      description: Required HTTP representation validator for the API catalog linkset.
      required: true
      schema:
        type: string
      example: W/"representation-7fa9"
    ETag:
      description: HTTP representation validator, which may be omitted; it is not
        a source revision identifier.
      schema:
        type: string
      example: W/"representation-7fa9"
    WwwAuthenticate:
      description: Bearer authentication challenge, with no record-specific facts.
      schema:
        type: string
      example: Bearer
    WriteCacheControl:
      description: Required no-store policy for protected Write and workflow responses.
      required: true
      schema:
        type: string
        const: no-store
