source_ambiguities:
- source: DRS-2
  description: The source uses database and database table interchangeably when describing relationships.
- source: DRS-1
  description: The source lists the default indexing and storage profile as `row store / column store / document store` without saying whether all three must be offered.
- source: DRS-2
  description: The source says links can be a foreign key, a soft link or a graph relationship, while only the foreign key is backed by `must`; the migration requires all three and the source does not say whether all are mandatory.
- source: DRS-2
  description: The source says it `should be possible` to open another database by clicking the record ID, while the example that follows is tagged REQUIRED.
- source: DRS-2
  description: The source lists cascade delete, restrict delete, and orphan tolerance without saying whether a relationship selects one rule or may combine them.
- source: DRS-3
  description: UTF-8 database or cluster encoding is listed among field types even though its wording describes a storage encoding.
- source: DRS-4
  description: The source requires old-version data to remain usable under later versions but does not define compatibility or migration rules.
- source: DRS-5
  description: Section 4.1 names generated REST, GraphQL, and OpenAPI services, while the source API contracts define REST operations only.
- source: DRS-5 and DRS-14
  description: DRS-5 says an analyst must be able to mark a field as PersonalDataID, while its DRS-14 cross-reference marks that feature optional.
- source: DRS-10 and DRS-11
  description: The notation JSON/YAML does not say whether both formats are required or whether one format is sufficient. The migrated statements keep the source `JSON or YAML` wording; whether one format suffices remains open.
- source: DRS-17
  description: The source names JavaScript field transformation without defining its execution environment or security constraints.
- source: DRS-20
  description: The source requires marketplace sharing but does not define a registry-template package format or marketplace protocol.
- source: DRS-19
  description: '`Mapping may have a transformation option` sits in a REQUIRED block without an (Optional) tag; the migration keeps `may` as a nonblocking recommendation.'
- source: DRS-20 and DRS-9
  description: DRS-20 includes views in a full registry template, while DRS-9 makes database views OPTIONAL; the source does not say what a template contains when the Database Views extension is not claimed.
- source: DRS-34
  description: The source asks for real examples "if possible" without a condition that makes the phrase verifiable.
- source: DRS-5 and DRS-9
  description: DRS-5 requires an analyst to create custom read API services from views, while DRS-9 marks the whole database-view functionality optional.
- source: DRS-5 and DRS-9
  description: DRS-5 labels dynamic field-level masking optional and cross-references DRS-9, but DRS-9 describes database views and does not define field-level masking.
- source: DRS-7
  description: The source requires the `highest level of integrity` for change logs but defines no comparative level or measurable threshold; it names log chaining as the only concrete mechanism.
- source: DRS-8, DRS-13, DRS-14, DRS-35, and DRS-37
  description: DRS-13 and DRS-14 make personal-data and owner-identifier field tagging optional, while DRS-8, DRS-35 and DRS-37 require logs, owner linking and owner reports that depend on those concepts.
- source: DRS-8
  description: The conditions under which law requires a legal justification or consent applies are not defined by the source.
- source: DRS-18
  description: The source requires applications to know a database encryption key and states that the user interface decrypts data, but does not define key transport, custody or rotation.
- source: DRS-19
  description: '`Webhook triggers` does not say whether the Digital Registry receives a webhook, publishes one, or observes it through another component.'
- source: DRS-26 and DRS-36
  description: DRS-26 requires APIs that extract data for external analytics, while DRS-36 makes a statistical-query API optional; the source does not define the boundary between those APIs.
- source: DRS-27
  description: The source joins email delivery and a unique secure URL with `or`, so it does not require both sharing mechanisms.
- source: DRS-27
  description: The source classifies data shared anonymously as Open Data without defining publication, licensing or withdrawal consequences.
- source: DRS-7 and DRS-37
  description: 'DRS-7 item 1.4 gives a data owner the option to see who has processed the owner''s data without naming a channel, while DRS-37 item 3 says the logs are visible `via API or via User Interface`; the either/or does not require both, so the migration models a variation point that needs at least one of the two options.'
- source: DRS-8
  description: 'The marker `(optional)` ends the final bullet `Data viewer''s role, org, location, Device fingerprint (optional)` and the source does not say whether it scopes only the device fingerprint or all four items; the migration reads it as scoping the device fingerprint and keeps role, organisation and location required.'
- source: DRS-27
  description: 'DRS-27 items 1 to 4 (time-bound, consent-required, role-restricted and QR-code sharing) are written as link features, so they presuppose a sharing link even though the opening sentence allows email delivery alone.'
- source: DRS-26
  description: 'The block header reads `should have the ability to (REQUIRED)`, so the source does not settle whether `should` makes the listed abilities recommendations or requirements; the migration keeps them REQUIRED, and the analytics extraction statement stays bound to `list` as the closest operation.'
- source: DRS-24 and DRS-25
  description: 'DRS-25 writes `CSV/XLS, JSON`, and the slash does not say whether both CSV and XLS are required; DRS-24 lists JSON, CSV and XLS with commas. The migrated export statement keeps all three formats.'
- source: Chapter 4, Interoperability item 12
  description: 'spec/4-key-digital-functionalities.md:40 writes `REST/GraphQL/OpenAPI`, and the slash does not say whether GraphQL is required alongside REST.'
- source: Chapter 4 item 16 and DRS-26
  description: 'Chapter 4 item 16 (spec/4-key-digital-functionalities.md:47), `Generate dashboards and administrative reports`, sits under a chapter described as core required functions, while DRS-26 marks custom dashboards as an option; the migration keeps the dashboard statement RECOMMENDED.'
- source: Workflow 9.1.3
  description: 'spec/9-workflows.md:112-113 postconditions 2 and 3 conflict: postcondition 2, labelled a simplification for the GovStack Sandbox instance, lets a non-authorised developer process the schema of databases where anonymous editing is allowed, while postcondition 3 says a user with no authorization cannot create or change any schema.'
- source: Chapter 4 item 15 and DRS-12
  description: 'Chapter 4 item 15 (spec/4-key-digital-functionalities.md:46) requires viewing statistics on registry usage, performance and data quality, while DRS-12 makes service usage statistics optional; the migration keeps the monitoring statement REQUIRED and the DRS-12 recording statements optional.'
- source: Chapter 8
  description: 'Chapter 8 calls its listed APIs `a minimal set of functionality that should be provided by any implementation` (spec/8-service-apis.md:9) and says the Building Block `is expected to host` them (spec/8-service-apis.md:31); the migration maps them to REQUIRED, and the `should` and `expected` wording does not settle the level.'
- source: Chapter 4 item 13
  description: 'Item 13, `Integrate with external systems through the Information Mediator BB` (spec/4-key-digital-functionalities.md:41), does not say whether every external integration must pass through the Information Mediator; the migration does not carry it as a separate statement because mediation is outside the system under test.'
